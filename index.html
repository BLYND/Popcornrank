<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PopcornRank — Audience &amp; IMDb Movie Rankings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F9FA;
      color: #202124;
    }
    h1, h2, h3, .font-display {
      font-family: 'Google Sans', 'Roboto', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .movie-tile-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.22;
      word-break: break-word;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white border-b border-[#DADCE0]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-9 h-9 rounded-full bg-[#1A73E8] text-white flex items-center justify-center font-display font-bold text-lg shadow-sm">
          🍿
        </div>
        <div>
          <span class="font-display font-bold text-xl tracking-tight text-[#202124]">Popcorn<span class="text-[#1A73E8]">Rank</span></span>
          <span id="catalogCountBadge" class="ml-2 text-xs font-medium px-2 py-0.5 rounded-full bg-[#E8F0FE] text-[#1A73E8]">Loading...</span>
        </div>
      </div>

      <div class="flex-1 max-w-xl">
        <div class="relative">
          <input
            id="searchInput"
            type="search"
            placeholder="Search movies, directors, actors, or year..."
            class="w-full pl-10 pr-4 py-2 rounded-full bg-[#F1F3F4] border border-transparent focus:bg-white focus:border-[#1A73E8] focus:outline-none text-sm transition"
          />
          <svg class="w-4 h-4 text-[#5F6368] absolute left-3.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z" />
          </svg>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button id="watchlistToggleBtn" class="px-3 py-1.5 rounded-full border border-[#DADCE0] bg-white hover:bg-[#F1F3F4] text-sm font-medium text-[#3C4043] transition">
          Watchlist (<span id="watchlistCount">0</span>)
        </button>
        <button id="openAddModalBtn" class="px-3.5 py-1.5 rounded-full bg-[#1A73E8] hover:bg-[#1557B0] text-white text-sm font-medium transition shadow-sm">
          + Add
        </button>
      </div>
    </div>

    <!-- Genre & Decade Bar -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 border-t border-[#F1F3F4] flex flex-wrap items-center justify-between gap-2">
      <div id="genrePills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      <div class="flex items-center gap-2">
        <select id="decadeSelect" class="text-xs sm:text-sm bg-white border border-[#DADCE0] rounded-full px-3 py-1.5 text-[#3C4043] focus:outline-none focus:border-[#1A73E8]">
          <option value="All">All Decades</option>
          <option value="2020s">2020s</option>
          <option value="2010s">2010s</option>
          <option value="2000s">2000s</option>
          <option value="1990s">1990s</option>
          <option value="1980s">1980s</option>
          <option value="Classic">Pre-1980 Classics</option>
        </select>
        <select id="sortSelect" class="text-xs sm:text-sm bg-white border border-[#DADCE0] rounded-full px-3 py-1.5 text-[#3C4043] font-medium focus:outline-none focus:border-[#1A73E8]">
          <option value="audience-avg-desc">Sort: Audience Avg (Popcorn + IMDb ×10)</option>
          <option value="popcorn-desc">Sort: Popcornmeter (High → Low)</option>
          <option value="imdb-desc">Sort: IMDb ×10 (High → Low)</option>
          <option value="tomatometer-desc">Sort: Tomatometer (High → Low)</option>
          <option value="reviews-desc">Sort: Most Reviews</option>
          <option value="year-desc">Sort: Newest First</option>
          <option value="title-asc">Sort: Title (A → Z)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Filter Controls -->
  <section class="max-w-7xl w-full mx-auto px-4 sm:px-6 pt-4">
    <div class="bg-white border border-[#DADCE0] rounded-2xl p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-4 sm:gap-6">
        <label class="flex items-center gap-2 text-sm text-[#3C4043] cursor-pointer">
          <input id="minReviewsToggle" type="checkbox" checked class="w-4 h-4 accent-[#1A73E8] rounded" />
          <span>Min <strong id="minReviewsLabel">500+</strong> reviews</span>
        </label>

        <div class="flex items-center gap-2 text-sm text-[#3C4043]">
          <span>Min Audience Avg:</span>
          <input id="minAvgSlider" type="range" min="0" max="95" step="5" value="0" class="w-24 sm:w-32 accent-[#1A73E8]" />
          <span id="minAvgLabel" class="font-medium text-[#1A73E8] w-9">0%</span>
        </div>

        <div class="flex items-center gap-1.5">
          <button data-preset="0" class="preset-btn px-2.5 py-1 rounded-full text-xs font-medium bg-[#E8F0FE] text-[#1A73E8]">All</button>
          <button data-preset="75" class="preset-btn px-2.5 py-1 rounded-full text-xs font-medium bg-[#F1F3F4] text-[#3C4043] hover:bg-[#E8EAED]">75%+</button>
          <button data-preset="85" class="preset-btn px-2.5 py-1 rounded-full text-xs font-medium bg-[#F1F3F4] text-[#3C4043] hover:bg-[#E8EAED]">85%+</button>
          <button data-preset="90" class="preset-btn px-2.5 py-1 rounded-full text-xs font-medium bg-[#F1F3F4] text-[#3C4043] hover:bg-[#E8EAED]">90%+</button>
        </div>
      </div>

      <div class="flex items-center gap-3 text-xs text-[#5F6368]">
        <span id="resultsSummary">Showing 0 movies</span>
        <button id="resetFiltersBtn" class="text-[#1A73E8] font-medium hover:underline">Reset</button>
      </div>
    </div>
  </section>

  <!-- Main Grid -->
  <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 flex-1">
    <div id="statusBanner" class="hidden mb-4 px-4 py-3 rounded-xl bg-[#FEF7E0] border border-[#F9AB00] text-sm text-[#3C4043]"></div>
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

    <div id="paginationBar" class="mt-8 flex flex-col items-center gap-2 hidden">
      <button id="loadMoreBtn" class="px-6 py-2.5 rounded-full bg-white border border-[#DADCE0] hover:bg-[#F1F3F4] text-sm font-medium text-[#1A73E8] shadow-sm transition">
        Load More Movies
      </button>
      <span id="paginationInfo" class="text-xs text-[#5F6368]"></span>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-xl border border-[#DADCE0] max-h-[90vh] flex flex-col">
      <div id="detailContent" class="overflow-y-auto p-5 sm:p-6"></div>
    </div>
  </div>

  <!-- Add Movie Modal -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-xl border border-[#DADCE0]">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-bold text-lg text-[#202124]">Add Movie to Browser List</h2>
        <button id="closeAddModalBtn" class="text-[#5F6368] hover:text-[#202124] text-xl leading-none">&times;</button>
      </div>
      <form id="addMovieForm" class="space-y-3 text-sm">
        <input name="title" required placeholder="Movie Title" class="w-full px-3 py-2 border border-[#DADCE0] rounded-lg" />
        <div class="grid grid-cols-2 gap-2.5">
          <input name="year" type="number" required value="2025" min="1920" max="2030" placeholder="Year" class="px-3 py-2 border border-[#DADCE0] rounded-lg" />
          <select name="genre" class="px-3 py-2 border border-[#DADCE0] rounded-lg bg-white">
            <option>Action</option><option>Sci-Fi</option><option>Comedy</option><option>Rom-Com</option>
            <option>Drama</option><option>Thriller</option><option>Horror</option><option>Animation</option>
          </select>
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <input name="popcorn" type="number" min="0" max="100" placeholder="Popcorn % (opt)" class="px-3 py-2 border border-[#DADCE0] rounded-lg" />
          <input name="imdbRaw" type="number" step="0.1" min="0" max="10" required placeholder="IMDb (e.g. 8.1)" class="px-3 py-2 border border-[#DADCE0] rounded-lg" />
          <input name="tomatometer" type="number" min="0" max="100" required placeholder="Critic %" class="px-3 py-2 border border-[#DADCE0] rounded-lg" />
        </div>
        <input name="reviews" type="number" min="0" value="5000" placeholder="Review Count" class="w-full px-3 py-2 border border-[#DADCE0] rounded-lg" />
        <input name="director" placeholder="Director" class="w-full px-3 py-2 border border-[#DADCE0] rounded-lg" />
        <textarea name="synopsis" rows="2" placeholder="Short synopsis..." class="w-full px-3 py-2 border border-[#DADCE0] rounded-lg"></textarea>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelAddBtn" class="px-4 py-2 rounded-full border border-[#DADCE0] text-[#3C4043]">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-full bg-[#1A73E8] text-white font-medium">Save Movie</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GENRES = ['All', 'Action', 'Sci-Fi', 'Comedy', 'Rom-Com', 'Drama', 'Thriller', 'Horror', 'Animation'];
    const PAGE_SIZE = 50;

    const FALLBACK_MOVIES = [
      { id: 1, imdbId: 'tt0111161', title: 'The Shawshank Redemption', year: 1994, genre: 'Drama', popcorn: 98, imdbRaw: 9.3, imdb10: 93, tomatometer: 89, reviews: 2950000, runtime: '2h 22m', director: 'Frank Darabont', cast: ['Tim Robbins', 'Morgan Freeman'], synopsis: 'Two imprisoned men bond over a number of years, finding solace and eventual redemption.', posterGradient: 'linear-gradient(135deg, #188038 0%, #0d5323 100%)', posterUrl: '' },
      { id: 2, imdbId: 'tt0468569', title: 'The Dark Knight', year: 2008, genre: 'Action', popcorn: 94, imdbRaw: 9.0, imdb10: 90, tomatometer: 94, reviews: 2930000, runtime: '2h 32m', director: 'Christopher Nolan', cast: ['Christian Bale', 'Heath Ledger'], synopsis: 'Batman faces the Joker in Gotham City.', posterGradient: 'linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%)', posterUrl: '' },
      { id: 3, imdbId: 'tt1745960', title: 'Top Gun: Maverick', year: 2022, genre: 'Action', popcorn: 99, imdbRaw: 8.2, imdb10: 82, tomatometer: 96, reviews: 735000, runtime: '2h 10m', director: 'Joseph Kosinski', cast: ['Tom Cruise', 'Miles Teller'], synopsis: 'Maverick trains a detachment of Top Gun graduates for a specialized mission.', posterGradient: 'linear-gradient(135deg, #e37400 0%, #7c2d12 100%)', posterUrl: '' },
      { id: 4, imdbId: 'tt15239678', title: 'Dune: Part Two', year: 2024, genre: 'Sci-Fi', popcorn: 95, imdbRaw: 8.5, imdb10: 85, tomatometer: 92, reviews: 540000, runtime: '2h 46m', director: 'Denis Villeneuve', cast: ['Timothee Chalamet', 'Zendaya'], synopsis: 'Paul Atreides unites with Chani and the Fremen while seeking revenge.', posterGradient: 'linear-gradient(135deg, #d93025 0%, #7f1d1d 100%)', posterUrl: '' },
      { id: 5, imdbId: 'tt9484998', title: 'Palm Springs', year: 2020, genre: 'Rom-Com', popcorn: 89, imdbRaw: 7.4, imdb10: 74, tomatometer: 94, reviews: 185000, runtime: '1h 30m', director: 'Max Barbakow', cast: ['Andy Samberg', 'Cristin Milioti'], synopsis: 'Two wedding guests get stuck in a Palm Springs time loop.', posterGradient: 'linear-gradient(135deg, #00838f 0%, #004d40 100%)', posterUrl: '' },
      { id: 6, imdbId: 'tt29623480', title: 'The Wild Robot', year: 2024, genre: 'Animation', popcorn: 98, imdbRaw: 8.2, imdb10: 82, tomatometer: 97, reviews: 115000, runtime: '1h 42m', director: 'Chris Sanders', cast: ["Lupita Nyong'o", 'Pedro Pascal'], synopsis: 'An intelligent robot stranded on an uninhabited island bonds with local animals.', posterGradient: 'linear-gradient(135deg, #5e35b1 0%, #311b92 100%)', posterUrl: '' }
    ];

    let allMovies = [];
    let visibleCount = PAGE_SIZE;
    let watchlist = new Set(JSON.parse(localStorage.getItem('popcornrank_watchlist') || '[]'));

    const state = {
      genre: 'All',
      decade: 'All',
      search: '',
      sort: 'audience-avg-desc',
      minReviews: true,
      minAvg: 0,
      onlyWatchlist: false
    };

    function getImdb10(m) {
      if (typeof m.imdb10 === 'number') return m.imdb10;
      if (typeof m.imdbRaw === 'number') return Math.round(m.imdbRaw * 10);
      return null;
    }

    function getAudienceAvg(m) {
      const p = typeof m.popcorn === 'number' ? m.popcorn : null;
      const i = getImdb10(m);
      if (p !== null && i !== null) return Number(((p + i) / 2).toFixed(1));
      if (p !== null) return p;
      if (i !== null) return i;
      return 0;
    }

    function formatReviews(n) {
      if (!n) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return Math.round(n / 1000) + 'K';
      return String(n);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function scoreColor(val) {
      if (val == null) return 'text-[#5F6368]';
      if (val >= 85) return 'text-[#188038]';
      if (val >= 60) return 'text-[#1A73E8]';
      return 'text-[#D93025]';
    }

    function renderGenrePills() {
      const el = document.getElementById('genrePills');
      el.innerHTML = GENRES.map((g) => {
        const active = state.genre === g;
        return `<button data-genre="${g}" class="genre-pill px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium whitespace-nowrap transition ${
          active ? 'bg-[#1A73E8] text-white shadow-sm' : 'bg-[#F1F3F4] text-[#3C4043] hover:bg-[#E8EAED]'
        }">${g}</button>`;
      }).join('');

      el.querySelectorAll('.genre-pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.genre = btn.dataset.genre;
          visibleCount = PAGE_SIZE;
          renderGenrePills();
          renderMovies();
        });
      });
    }

    function getFilteredMovies() {
      const q = state.search.trim().toLowerCase();
      return allMovies
        .filter((m) => {
          if (state.onlyWatchlist && !watchlist.has(String(m.id))) return false;
          if (state.genre !== 'All' && m.genre !== state.genre) return false;
          if (state.decade !== 'All') {
            if (state.decade === 'Classic') {
              if (m.year >= 1980) return false;
            } else {
              const dec = `${Math.floor(m.year / 10) * 10}s`;
              if (dec !== state.decade) return false;
            }
          }
          if (state.minReviews && (m.reviews || 0) < 500) return false;
          if (getAudienceAvg(m) < state.minAvg) return false;
          if (q) {
            const hay = `${m.title} ${m.year} ${m.director || ''} ${(m.cast || []).join(' ')} ${m.genre}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          switch (state.sort) {
            case 'audience-avg-desc': return getAudienceAvg(b) - getAudienceAvg(a);
            case 'popcorn-desc': return (b.popcorn ?? -1) - (a.popcorn ?? -1);
            case 'imdb-desc': return (getImdb10(b) ?? -1) - (getImdb10(a) ?? -1);
            case 'tomatometer-desc': return (b.tomatometer ?? -1) - (a.tomatometer ?? -1);
            case 'reviews-desc': return (b.reviews || 0) - (a.reviews || 0);
            case 'year-desc': return (b.year || 0) - (a.year || 0);
            case 'title-asc': return String(a.title).localeCompare(String(b.title));
            default: return 0;
          }
        });
    }

    function fitMovieTileTitles() {
      document.querySelectorAll('.movie-tile-title').forEach((el) => {
        let size = 15;
        el.style.fontSize = size + 'px';
        while (el.scrollHeight > el.clientHeight + 1 && size > 11) {
          size -= 0.5;
          el.style.fontSize = size + 'px';
        }
      });
    }

    function renderMovies() {
      const filtered = getFilteredMovies();
      const slice = filtered.slice(0, visibleCount);
      const grid = document.getElementById('moviesGrid');

      document.getElementById('resultsSummary').textContent = `Showing ${slice.length} of ${filtered.length} movies`;
      document.getElementById('watchlistCount').textContent = watchlist.size;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full bg-white border border-[#DADCE0] rounded-2xl p-10 text-center text-[#5F6368]">No movies match your current filters.</div>`;
        document.getElementById('paginationBar').classList.add('hidden');
        return;
      }

      grid.innerHTML = slice.map((m) => {
        const avg = getAudienceAvg(m);
        const imdb10 = getImdb10(m);
        const hasPopcorn = typeof m.popcorn === 'number';
        const saved = watchlist.has(String(m.id));
        const posterBg = m.posterGradient || 'linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%)';

        return `
          <article data-id="${escapeHtml(m.id)}" class="movie-card group bg-white border border-[#DADCE0] hover:border-[#1A73E8] rounded-2xl overflow-hidden shadow-xs hover:shadow-md transition cursor-pointer flex flex-col">
            <div class="relative aspect-[2/3] w-full overflow-hidden" style="background: ${posterBg}">
              ${m.posterUrl ? `<img src="${escapeHtml(m.posterUrl)}" alt="${escapeHtml(m.title)}" loading="lazy" onerror="this.remove()" class="w-full h-full object-cover" />` : ''}
              <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent"></div>
              <div class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-full bg-white/95 text-[#202124] text-xs font-bold shadow-sm">
                Avg ${avg}%
              </div>
              <button data-watch="${escapeHtml(m.id)}" class="watch-btn absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 hover:bg-white text-sm flex items-center justify-center shadow-sm" title="Watchlist">
                ${saved ? '★' : '☆'}
              </button>
              <div class="absolute bottom-2.5 left-3 right-3 text-white">
                <h3 class="movie-tile-title font-display font-bold text-[15px] drop-shadow">${escapeHtml(m.title)}</h3>
                <p class="text-[11px] text-white/85 mt-0.5">${m.year} · ${escapeHtml(m.genre)}</p>
              </div>
            </div>

            <div class="p-3 flex-1 flex flex-col justify-between gap-2 text-xs">
              <div class="grid grid-cols-3 gap-1 text-center">
                <div class="bg-[#F8F9FA] rounded-lg py-1.5 px-1">
                  <div class="text-[10px] text-[#5F6368]">Popcorn</div>
                  <div class="font-bold ${hasPopcorn ? scoreColor(m.popcorn) : 'text-[#5F6368]'}">${hasPopcorn ? m.popcorn + '%' : 'N/A'}</div>
                </div>
                <div class="bg-[#F8F9FA] rounded-lg py-1.5 px-1">
                  <div class="text-[10px] text-[#5F6368]">IMDb ×10</div>
                  <div class="font-bold ${scoreColor(imdb10)}">${imdb10 != null ? imdb10 + '%' : 'N/A'}</div>
                </div>
                <div class="bg-[#F8F9FA] rounded-lg py-1.5 px-1">
                  <div class="text-[10px] text-[#5F6368]">Critics</div>
                  <div class="font-bold ${scoreColor(m.tomatometer)}">${m.tomatometer != null ? m.tomatometer + '%' : 'N/A'}</div>
                </div>
              </div>
              <div class="flex items-center justify-between text-[11px] text-[#5F6368] pt-1 border-t border-[#F1F3F4]">
                <span>${formatReviews(m.reviews)} reviews</span>
                <span class="truncate max-w-[110px]">${escapeHtml(m.director || '')}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');

      const pagBar = document.getElementById('paginationBar');
      if (filtered.length > visibleCount) {
        pagBar.classList.remove('hidden');
        document.getElementById('paginationInfo').textContent = `Showing ${slice.length} of ${filtered.length} matching titles`;
      } else {
        pagBar.classList.add('hidden');
      }

      grid.querySelectorAll('.watch-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.watch;
          if (watchlist.has(id)) watchlist.delete(id);
          else watchlist.add(id);
          localStorage.setItem('popcornrank_watchlist', JSON.stringify(Array.from(watchlist)));
          renderMovies();
        });
      });

      grid.querySelectorAll('.movie-card').forEach((card) => {
        card.addEventListener('click', () => {
          const movie = allMovies.find((item) => String(item.id) === card.dataset.id);
          if (movie) openDetailModal(movie);
        });
      });

      requestAnimationFrame(fitMovieTileTitles);
    }

    function openDetailModal(m) {
      const avg = getAudienceAvg(m);
      const imdb10 = getImdb10(m);
      const hasPopcorn = typeof m.popcorn === 'number';
      const modal = document.getElementById('detailModal');
      document.getElementById('detailContent').innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-[#E8F0FE] text-[#1A73E8]">${escapeHtml(m.genre)} · ${m.year}</span>
            <h2 class="font-display font-bold text-2xl text-[#202124] mt-1.5">${escapeHtml(m.title)}</h2>
            <p class="text-xs text-[#5F6368] mt-0.5">${escapeHtml(m.runtime || '')} · Directed by ${escapeHtml(m.director || 'Unknown')}</p>
          </div>
          <button id="closeDetailBtn" class="text-2xl text-[#5F6368] hover:text-[#202124] leading-none">&times;</button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-4 text-center">
          <div class="p-3 rounded-xl bg-[#E8F0FE]">
            <div class="text-xs text-[#1A73E8] font-medium">Audience Avg</div>
            <div class="text-xl font-bold text-[#1A73E8]">${avg}%</div>
          </div>
          <div class="p-3 rounded-xl bg-[#F8F9FA] border border-[#DADCE0]">
            <div class="text-xs text-[#5F6368]">Popcornmeter</div>
            <div class="text-xl font-bold">${hasPopcorn ? m.popcorn + '%' : 'N/A'}</div>
          </div>
          <div class="p-3 rounded-xl bg-[#F8F9FA] border border-[#DADCE0]">
            <div class="text-xs text-[#5F6368]">IMDb (×10)</div>
            <div class="text-xl font-bold">${imdb10 != null ? imdb10 + '%' : 'N/A'}</div>
          </div>
          <div class="p-3 rounded-xl bg-[#F8F9FA] border border-[#DADCE0]">
            <div class="text-xs text-[#5F6368]">Tomatometer</div>
            <div class="text-xl font-bold">${m.tomatometer != null ? m.tomatometer + '%' : 'N/A'}</div>
          </div>
        </div>

        <p class="text-sm text-[#3C4043] leading-relaxed mb-4">${escapeHtml(m.synopsis || 'No synopsis available.')}</p>
        ${(m.cast && m.cast.length) ? `<p class="text-xs text-[#5F6368]"><strong>Cast:</strong> ${escapeHtml(m.cast.join(', '))}</p>` : ''}
        <p class="text-xs text-[#5F6368] mt-1"><strong>Verified Reviews:</strong> ${(m.reviews || 0).toLocaleString()}</p>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('closeDetailBtn').addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });
    }

    async function loadCatalog() {
      const custom = JSON.parse(localStorage.getItem('popcornrank_custom_movies') || '[]');
      let loaded = [];
      try {
        const res = await fetch('./movies.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) loaded = data;
      } catch (err) {
        const banner = document.getElementById('statusBanner');
        banner.textContent = 'Note: Could not load ./movies.json — showing built-in starter movies.';
        banner.classList.remove('hidden');
      }

      const base = loaded.length > 0 ? loaded : FALLBACK_MOVIES;
      allMovies = [...custom, ...base];
      document.getElementById('catalogCountBadge').textContent = `${allMovies.length.toLocaleString()} titles`;
      renderMovies();
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.search = e.target.value;
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('decadeSelect').addEventListener('change', (e) => {
        state.decade = e.target.value;
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        state.sort = e.target.value;
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('minReviewsToggle').addEventListener('change', (e) => {
        state.minReviews = e.target.checked;
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('minAvgSlider').addEventListener('input', (e) => {
        state.minAvg = Number(e.target.value);
        document.getElementById('minAvgLabel').textContent = state.minAvg + '%';
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.minAvg = Number(btn.dataset.preset);
          document.getElementById('minAvgSlider').value = state.minAvg;
          document.getElementById('minAvgLabel').textContent = state.minAvg + '%';
          visibleCount = PAGE_SIZE;
          renderMovies();
        });
      });

      document.getElementById('resetFiltersBtn').addEventListener('click', () => {
        state.genre = 'All';
        state.decade = 'All';
        state.search = '';
        state.sort = 'audience-avg-desc';
        state.minReviews = true;
        state.minAvg = 0;
        state.onlyWatchlist = false;
        document.getElementById('searchInput').value = '';
        document.getElementById('decadeSelect').value = 'All';
        document.getElementById('sortSelect').value = 'audience-avg-desc';
        document.getElementById('minReviewsToggle').checked = true;
        document.getElementById('minAvgSlider').value = 0;
        document.getElementById('minAvgLabel').textContent = '0%';
        visibleCount = PAGE_SIZE;
        renderGenrePills();
        renderMovies();
      });

      document.getElementById('watchlistToggleBtn').addEventListener('click', () => {
        state.onlyWatchlist = !state.onlyWatchlist;
        document.getElementById('watchlistToggleBtn').classList.toggle('bg-[#E8F0FE]', state.onlyWatchlist);
        visibleCount = PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('loadMoreBtn').addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderMovies();
      });

      document.getElementById('detailModal').addEventListener('click', (e) => {
        if (e.target.id === 'detailModal') {
          e.currentTarget.classList.add('hidden');
          e.currentTarget.classList.remove('flex');
        }
      });

      const addModal = document.getElementById('addModal');
      const closeAdd = () => { addModal.classList.add('hidden'); addModal.classList.remove('flex'); };
      document.getElementById('openAddModalBtn').addEventListener('click', () => {
        addModal.classList.remove('hidden');
        addModal.classList.add('flex');
      });
      document.getElementById('closeAddModalBtn').addEventListener('click', closeAdd);
      document.getElementById('cancelAddBtn').addEventListener('click', closeAdd);

      document.getElementById('addMovieForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const imdbRaw = parseFloat(fd.get('imdbRaw'));
        const popcornVal = fd.get('popcorn') !== '' ? Number(fd.get('popcorn')) : null;
        const newMovie = {
          id: 'custom-' + Date.now(),
          title: fd.get('title'),
          year: Number(fd.get('year')),
          genre: fd.get('genre'),
          popcorn: popcornVal,
          imdbRaw,
          imdb10: Math.round(imdbRaw * 10),
          tomatometer: Number(fd.get('tomatometer')),
          reviews: Number(fd.get('reviews') || 5000),
          director: fd.get('director') || 'Unknown',
          synopsis: fd.get('synopsis') || '',
          posterGradient: 'linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%)',
          posterUrl: ''
        };
        const custom = JSON.parse(localStorage.getItem('popcornrank_custom_movies') || '[]');
        custom.unshift(newMovie);
        localStorage.setItem('popcornrank_custom_movies', JSON.stringify(custom));
        allMovies.unshift(newMovie);
        document.getElementById('catalogCountBadge').textContent = `${allMovies.length.toLocaleString()} titles`;
        e.target.reset();
        closeAdd();
        renderMovies();
      });

      window.addEventListener('resize', fitMovieTileTitles);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderGenrePills();
      bindEvents();
      loadCatalog();
    });
  </script>
</body>
</html>
